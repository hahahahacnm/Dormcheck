<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f7fc;color:#253149;font-family:Arial,'Microsoft YaHei','PingFang SC',sans-serif;-webkit-text-size-adjust:100%;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;background-color:#f4f7fc;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;max-width:560px;border-collapse:separate;background-color:#ffffff;border:1px solid #e5eaf3;border-radius:14px;">
          <tr>
            <td style="padding:26px 26px 0;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;">
                <tr>
                  {{if .LogoURL}}<td valign="middle" width="36" style="width:36px;padding-right:10px;"><img src="{{.LogoURL}}" alt="" width="36" height="36" style="display:block;width:36px;height:36px;border:0;"></td>{{end}}
                  <td valign="middle" style="color:#3152b6;font-size:14px;line-height:20px;font-weight:bold;">DormCheck <span style="font-size:13px;">🐾</span></td>
                  <td align="right" valign="middle" width="44" style="width:44px;padding-left:8px;"><img src="https://q1.qlogo.cn/g?b=qq&amp;nk=2219911811&amp;s=640" alt="furry" width="44" height="44" style="display:block;width:44px;height:44px;border:0;border-radius:10px;"></td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 26px 4px;">
              <h1 style="margin:0;color:#1a2740;font-size:20px;line-height:1.4;font-weight:700;word-break:break-word;">{{.Subject}}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:4px 26px 22px;color:#334155;font-size:15px;line-height:1.7;word-break:break-word;">
              {{.Body}}
              {{if .ActionURL}}
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:22px;border-collapse:collapse;">
                <tr><td style="background-color:#315eea;border-radius:8px;padding:10px 18px;"><a href="{{.ActionURL}}" style="display:inline-block;color:#ffffff;text-decoration:none;font-size:14px;font-weight:bold;">{{.ActionText}}</a></td></tr>
              </table>
              {{end}}
            </td>
          </tr>
          <tr>
            <td style="padding:0 26px 24px;">
              <div style="border-top:1px solid #e9edf5;padding-top:16px;color:#7a8598;font-size:12px;line-height:1.6;">DormCheck · 自动化托管平台<br>该邮件由系统自动发出，无需回复。</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
